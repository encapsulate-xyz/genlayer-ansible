---
- name: Set up Web Driver healthcheck
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [webdriver]
  vars_files:
    - group_vars/all.yml
    - group_vars/default.yml
    - group_vars/{{ network | default(env) }}.yml

  pre_tasks:
    - name: Setup environment
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run webdriver healthcheck role
      when: type in allowed_node_types
      block:
        - name: Set service_identifier
          ansible.builtin.set_fact:
            webdriver_service_identifier: "{{ service_identifier }}"
            # -clarke stays last, and "health" is shortened there because Linux user names stop at 32 characters
            service_identifier: >-
              {{ service_identifier | regex_replace('-clarke$', '') ~ '-health-clarke' if env == 'clarke'
              else service_identifier ~ '-healthcheck' }}
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include webdriver healthcheck role
          ansible.builtin.include_role:
            name: webdriver_healthcheck

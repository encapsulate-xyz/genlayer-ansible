---
- name: Include user creation task
  ansible.builtin.include_tasks: tasks/create_user_and_directories.yml
  vars:
    home: "{{ webdriver_healthcheck_home_dir }}"
    directories: "{{ webdriver_healthcheck_directories }}"
    log_file_path: "{{ webdriver_healthcheck_log_file_path }}"

- name: Install dependencies
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true

- name: Copy healthcheck script
  ansible.builtin.template:
    src: healthcheck.sh.j2
    dest: "{{ webdriver_healthcheck_bin_dir }}/{{ service_identifier }}"
    owner: root
    group: root
    mode: "0755"

- name: Copy systemd service and timer files
  ansible.builtin.template:
    src: "systemd.{{ item }}.j2"
    dest: /etc/systemd/system/{{ service_identifier }}.{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  notify:
    - Reload service
    - Restart timer

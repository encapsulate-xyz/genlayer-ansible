---
# runs setup_node.yml on a fresh Ubuntu 24.04 container, runs it again to check nothing changes,
# then checks what it left on the host (verify.yml)
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/collections/requirements.yml

driver:
  name: docker

platforms:
  - name: genlayer-validator
    image: ubuntu:24.04
    # our servers are amd64, and genlayer only ships amd64 binaries
    platform: linux/amd64
    dockerfile: ../shared/Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    # the monitor server only resolves over Tailscale; same address as monitor_server_test_ip.
    # Grafana Cloud points at the container itself; same names as grafana_cloud_hosts
    etc_hosts:
      h1-finland-hub-monitor.crane-goldeye.ts.net: 100.64.0.10
      logs-prod-042.grafana.net: 127.0.0.1
      prometheus-prod-66-prod-us-east-3.grafana.net: 127.0.0.1
    networks:
      - name: genlayer-molecule
    groups:
      - genlayer

ansible:
  cfg:
    defaults:
      # same as ansible.cfg
      hash_behaviour: merge
      interpreter_python: /usr/bin/python3
  env:
    VAULT_TOKEN: molecule-fake-token
  playbooks:
    prepare: ../shared/prepare.yml
    side_effect: side_effect.yml
    cleanup: ../shared/cleanup.yml

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../shared/group_vars/
      host_vars: host_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy

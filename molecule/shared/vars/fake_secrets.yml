---
# what the fake HCP Vault serves, at the same mount and paths as the real one.
# the keys match roles/node/templates/secrets.env.example; every value is fake.
fake_vault_mount: testnet

fake_vault_secrets:
  - path: genlayer/encapsulate/validator/genlayer.secrets.env
    data:
      GENLAYERNODE_PASSWORD: molecule-fake-password
      HEURISTKEY: molecule-fake-key
      IOINTELLIGENCEKEY: molecule-fake-key
      GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCKEY: molecule-fake-key

  - path: genlayer/encapsulate/validator/operator.json
    data:
      address: "0000000000000000000000000000000000000000"
      crypto:
        cipher: aes-128-ctr
        ciphertext: "00"
      version: 3

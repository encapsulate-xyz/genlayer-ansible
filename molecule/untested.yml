---
# Tasks that no Molecule scenario runs, each with the reason. CI fails if a task neither runs in a
# scenario nor is listed here, and if a listed task starts running, so keep this list current.

# setup_node.yml tasks a scenario can't reach
- file: tasks/verify_service.yml
  reason: needs a node that reaches the real chain to pass /health; it runs after every real deploy
- file: tasks/get_and_save_vault_secret.yml
  task: Save the fetched key secret to the file
  reason: genlayer has no key-type secret
- file: tasks/get_and_save_vault_secret.yml
  task: Save the fetched Base64-encoded secret to the file
  reason: genlayer has no base64 secret
- file: roles/node/tasks/extract_binaries.yml
  task: Run GenVM setup script to patch runners
  reason: off by default (setup_genvm), and it downloads the GenVM runners from upstream

# playbooks with no scenario yet
- file: setup_alloy.yml

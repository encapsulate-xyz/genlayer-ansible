---
- name: Set up Genlayer node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run node role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include node role
          ansible.builtin.include_role:
            name: node

  post_tasks:
    - name: Verify the node
      when: type in allowed_node_types
      ansible.builtin.include_tasks: tasks/verify_service.yml
      vars:
        # 503 only when the node is stuck (sync blocked, banned); a node still syncing returns 200
        verify_health_url: "http://127.0.0.1:{{ genlayer.validator.ports.metrics_port }}/health"
